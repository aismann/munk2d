name: Shape owner pruning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        owners: ['OFF', 'DEFAULT']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-owners -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DEMOS=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=ON
          ${{ matrix.owners == 'OFF' && '-DMUNK2D_ENABLE_SHAPE_OWNER_PRUNING=OFF' || '' }}
          -DCMAKE_C_FLAGS="${{ runner.os != 'Windows' && runner.arch == 'X64' && '-march=x86-64 -mtune=generic' || '' }}"
          -DCMAKE_CXX_FLAGS="${{ runner.os != 'Windows' && runner.arch == 'X64' && '-march=x86-64 -mtune=generic' || '' }}"
          -DMUNK2D_ENABLE_NEON_CONTACT_SOLVER=${{ runner.arch == 'ARM64' && 'ON' || 'OFF' }}
      - name: Verify owner setting
        shell: bash
        env:
          EXPECTED_OWNER_PRUNING: ${{ matrix.owners == 'OFF' && 'OFF' || 'ON' }}
        run: grep -Fx "MUNK2D_ENABLE_SHAPE_OWNER_PRUNING:BOOL=$EXPECTED_OWNER_PRUNING" build-owners/CMakeCache.txt
      - name: Build
        run: cmake --build build-owners --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-owners -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-owners -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_DEMOS=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=ON
          -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=ON
          -DMUNK2D_ENABLE_SHAPE_OWNER_PRUNING=ON -DMUNK2D_ENABLE_LTO=OFF
          -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-owners --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-owners --output-on-failure

  wasm-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build and test default owners
        env:
          SIMD: ${{ matrix.simd }}
        run: tests/build-wasm.sh build-owners-wasm
      - name: Browser solver and compound workloads
        env:
          SIMD: ${{ matrix.simd }}
        run: node tests/run-wasm-browser.mjs build-owners-wasm/browser chromium
